name: Toxic Tales artifact housekeeping

on:
  push:
    branches: [main]
    paths: ['.github/workflows/artifact-housekeeping.yml']
  schedule:
    - cron: '10 23 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: toxic-tales-artifact-housekeeping
  cancel-in-progress: true

jobs:
  prune:
    if: github.repository == 'akshaymohan16/toxic-tales-library'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify authorized live Pages site
        run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://akshaymohan16.github.io/toxic-tales-library/health.json',timeout=25) as r:
              site=json.load(r)
          assert site['repository']=='akshaymohan16/toxic-tales-library'
          print('Live Pages archive verified. No published or source files will be deleted.')
          PY
      - name: Delete only redundant historical 100MB+ previews, retaining newest legacy QA
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='akshaymohan16/toxic-tales-library'
          base='https://api.github.com/repos/'+repo+'/actions/artifacts'
          header={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          items=[]
          for page in range(1,21):
              q=urllib.request.Request(base+'?per_page=100&page='+str(page),headers=header)
              with urllib.request.urlopen(q,timeout=30) as r: part=json.load(r)['artifacts']
              items.extend(part)
              if len(part)<100: break
          preview=[a for a in items if a['name']=='toxic-tales-site-preview'
                   and a['size_in_bytes']>20_000_000 and not a['expired']]
          qa=[a for a in items if a['name']=='toxic-tales-live-verification'
              and a['size_in_bytes']>20_000_000 and not a['expired']]
          keep=max(qa,key=lambda a:a['created_at']) if qa else None
          unused=preview+[a for a in qa if a['id']!=(keep or {}).get('id')]
          if len(unused)>100: raise RuntimeError('Deletion safety limit exceeded')
          print('Redundant old archives:',len(unused),'bytes:',sum(a['size_in_bytes'] for a in unused))
          print('Retaining newest legacy QA:',(keep or {}).get('id'))
          for a in unused:
              req=urllib.request.Request(base+'/'+str(a['id']),headers=header,method='DELETE')
              with urllib.request.urlopen(req,timeout=30) as response:
                  assert response.status==204
              print('Pruned:',a['name'],a['id'])
          print('Preserved public Pages media, source commits, approved releases and current compact QA.')
          PY
