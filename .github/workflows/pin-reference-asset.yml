name: Pin freely licensed reference asset bytes
on:
  push:
    branches: [main]
    paths: ['automation/asset-hash-request.json']
permissions:
  contents: read
jobs:
  inspect-only:
    if: github.repository == 'akshaymohan16/toxic-tales-library'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Read approved Wikimedia asset and report its SHA256
        run: |
          python - <<'PY'
          import hashlib, json, urllib.parse, urllib.request
          from pathlib import Path
          j = json.loads(Path('automation/asset-hash-request.json').read_text())
          assert j['repository'] == 'akshaymohan16/toxic-tales-library'
          assert j['episode_id'] == 'TT-009'
          assert j['licence'] == 'CC BY 4.0'
          url = j['url']
          parsed = urllib.parse.urlparse(url)
          assert parsed.scheme == 'https' and parsed.hostname == 'thumb.wikimedia.org'
          assert parsed.path == '/wikipedia/commons/thumb/0/02/Cataglyphis_cursor_creticus_casent0102116_dorsal_1.jpg/960px-Cataglyphis_cursor_creticus_casent0102116_dorsal_1.jpg'
          req = urllib.request.Request(url, headers={'User-Agent':'ToxicTalesAssetPin/1.0 (research reproduction)'})
          h = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(req, timeout=35) as res:
              assert res.status == 200
              assert res.geturl() == url
              while True:
                  chunk = res.read(65536)
                  if not chunk: break
                  size += len(chunk)
                  assert size <= 2500000
                  h.update(chunk)
          assert 10000 < size < 1500000
          print('ASSET_PIN_RESULT',json.dumps({'url':url, 'bytes':size,
                'sha256':h.hexdigest(),'licence':'CC BY 4.0',
                'source':'https://commons.wikimedia.org/wiki/File:Cataglyphis_cursor_creticus_casent0102116_dorsal_1.jpg'}))
          PY
