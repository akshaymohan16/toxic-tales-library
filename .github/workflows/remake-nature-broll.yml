name: Remake natural B-roll - NO PUBLISHING
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remake-nature-broll.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    if: github.repository == 'akshaymohan16/toxic-tales-library'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch clearly licensed reference clip
        run: |
          mkdir reference
          python3 - <<'PY'
          import urllib.request,json,hashlib
          from pathlib import Path
          url='https://upload.wikimedia.org/wikipedia/commons/3/3e/Guppies_%28Poecilia_reticulata%29_in_an_aquarium.webm'
          req=urllib.request.Request(url,headers={'User-Agent':'ToxicTales-EditorialReview/1.0'})
          with urllib.request.urlopen(req,timeout=90) as r: b=r.read(25000000)
          p=Path('reference/aquarium_naturebox.webm');p.write_bytes(b)
          Path('reference/rights.json').write_text(json.dumps({'file':p.name,'source':'https://commons.wikimedia.org/wiki/File:Guppies_(Poecilia_reticulata)_in_an_aquarium.webm','author':'The Nature Box','license':'CC BY 4.0','license_url':'https://creativecommons.org/licenses/by/4.0/','sha256':hashlib.sha256(b).hexdigest(),'note':'Reference aquarium video, also includes other species. Select guppy-centred shots. Not footage from the cited experiment. Credit cropping, grading and editing. No publishing or deployment.'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: remake-nature-broll
          path: reference
          retention-days: 7
