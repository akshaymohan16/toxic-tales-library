name: Inspect licensed TT-012 species reference
on:
  push:
    branches: [main]
    paths:
      - 'automation/qa/tt-012-asset-request.json'
permissions:
  contents: read
jobs:
  inspect-only:
    if: github.repository == 'akshaymohan16/toxic-tales-library'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact reference image bytes (read only)
        run: |
          python - <<'PY'
          import json, hashlib, urllib.request, urllib.parse, time
          from pathlib import Path
          p=Path('automation/qa/tt-012-asset-request.json')
          j=json.loads(p.read_bytes())
          assert j['repository']=='akshaymohan16/toxic-tales-library'
          assert j['episode_id']=='TT-012' and j['licence']=='CC BY 4.0'
          url=j['url']
          assert url=='https://upload.wikimedia.org/wikipedia/commons/b/bf/Octopus_rubescens_189172764.jpg'
          for attempt in range(3):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ToxicTalesOpenReferenceHash/1.0 (licensed species image QA)'})
                  with urllib.request.urlopen(req,timeout=35) as res:
                      assert res.status==200 and urllib.parse.urlparse(res.geturl()).hostname=='upload.wikimedia.org'
                      data=res.read(6000001)
                      assert 30000<len(data)<=6000000 and data[:3]==b'\xff\xd8\xff'
                  print('ASSET_PIN_RESULT',json.dumps({'request_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'licence':j['licence'],'source_page':j['source_page']}),flush=True)
                  break
              except Exception:
                  if attempt==2: raise
                  time.sleep(10*(attempt+1))
          PY
