name: Build and deploy Toxic Tales
on:
  push:
    branches: [main]
    paths: ['episodes/**', 'evidence/**', 'quality/**', 'MEMORY.md', 'OPERATIONS.md', 'automation/config.json', 'automation/published.json', 'scripts/**', 'site/**', '.github/workflows/publish-library.yml', 'requirements.txt']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: toxic-tales-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'akshaymohan16/toxic-tales-library'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            render-cache
            site/media
            site/qa
          key: toxic-tales-v4-${{ runner.os }}-${{ hashFiles('scripts/**', 'episodes/**', 'requirements.txt') }}
          restore-keys: toxic-tales-v4-${{ runner.os }}-
      - name: Install free offline tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Test exact-file releases and caption safeguards
        run: python scripts/test_gates.py
      - name: Build reviewed stories and media
        env:
          OMP_NUM_THREADS: '2'
        run: python scripts/build.py
      - name: Save build even if Pages is not yet enabled
        uses: actions/upload-artifact@v4
        with:
          name: toxic-tales-site-preview
          path: site
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.repository == 'akshaymohan16/toxic-tales-library'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages is enabled
        uses: actions/configure-pages@v5
      - name: Deploy public source library
        id: deployment
        uses: actions/deploy-pages@v4
  verify-public-media:
    if: github.repository == 'akshaymohan16/toxic-tales-library'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: toxic-tales-site-preview
          path: expected-site
      - name: Install free validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install Pillow==11.3.0
      - name: Verify anonymous downloads and exact media
        run: python scripts/verify_live.py
      - name: Save public-media QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toxic-tales-live-verification
          path: verification
          retention-days: 30

